<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Agent System — Customer Support Architecture</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1e1e1e; --line:#1e1e1e; --sub:#495057;
    --blue:#e7f5ff; --blue-line:#1971c2;
    --green:#ebfbee; --green-line:#2f9e44;
    --yellow:#fff9db; --yellow-line:#f08c00;
    --violet:#f3f0ff; --violet-line:#7048e8;
    --gray:#f1f3f5; --gray-line:#495057;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121212; --ink:#e9ecef; --sub:#adb5bd;
      --blue:#0b2942; --green:#0b3320; --yellow:#3a2e05; --violet:#221a3d; --gray:#26282b;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121212; --ink:#e9ecef; --sub:#adb5bd;
    --blue:#0b2942; --green:#0b3320; --yellow:#3a2e05; --violet:#221a3d; --gray:#26282b;
  }
  html,body{background:var(--bg); margin:0; padding:0; box-sizing:border-box;}
  body{
    font-family: "Comic Sans MS","Segoe Print","Bradley Hand",cursive;
    color:var(--ink);
    padding: env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:1240px;margin:0 auto;padding:20px 0 40px;}
  h1{font-size:20px;font-weight:500;text-align:center;margin:0 0 4px;}
  p.sub{text-align:center;color:var(--sub);font-size:13px;margin:0 0 18px;}
  .scroller{width:100%;overflow-x:auto;}
  svg{display:block;min-width:1160px;}
  text{fill:var(--ink);}
  .lbl{font-size:13px;}
  .lbl-s{font-size:12px;fill:var(--sub);}
  .arr{fill:var(--ink);}
  .edge{stroke:var(--ink);stroke-width:1.6;fill:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>How to design an AI agent system for e-commerce DTC customer support</h1>
  <p class="sub">Returns, exchanges &amp; WISMO — recreated from the whiteboard walkthrough</p>
  <div class="scroller">
<svg viewBox="0 0 1160 1180" width="1160" height="1180" role="img">
<title>AI agent customer support architecture diagram</title>
<desc>Flow from user channels through router, Q&A and return-planner agents to Shopify and Stripe APIs, guarded by policy and human approval.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L8 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Observability header -->
<rect x="20" y="20" width="1120" height="34" rx="17" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
<text x="580" y="41" text-anchor="middle" class="lbl">Observability, metrics &amp; evals</text>

<!-- Relational DB -->
<g>
  <ellipse cx="130" cy="110" rx="42" ry="12" fill="var(--gray)" stroke="var(--gray-line)"/>
  <path d="M88 110 v50 a42 12 0 0 0 84 0 v-50" fill="var(--gray)" stroke="var(--gray-line)"/>
  <ellipse cx="130" cy="160" rx="42" ry="12" fill="none" stroke="var(--gray-line)"/>
  <line x1="88" y1="135" x2="172" y2="135" stroke="var(--gray-line)" stroke-width="0.7"/>
  <text x="130" y="190" text-anchor="middle" class="lbl">Relational DB</text>
</g>

<!-- User Channels -->
<rect x="330" y="95" width="200" height="70" rx="10" fill="var(--blue)" stroke="var(--blue-line)" stroke-width="1.6"/>
<text x="430" y="123" text-anchor="middle" class="lbl">User channels</text>
<text x="430" y="143" text-anchor="middle" class="lbl-s">Web chat, email</text>

<!-- Gateway diamond -->
<polygon points="740,40 830,90 740,140 650,90" fill="var(--violet)" stroke="var(--violet-line)" stroke-width="1.6"/>
<text x="740" y="80" text-anchor="middle" class="lbl-s">Gateway</text>
<text x="740" y="96" text-anchor="middle" class="lbl-s">Auth/SSO, PII,</text>
<text x="740" y="110" text-anchor="middle" class="lbl-s">rate limit, dedupe</text>

<!-- CRM -->
<rect x="930" y="95" width="200" height="80" rx="10" fill="var(--gray)" stroke="var(--gray-line)" stroke-width="1.6"/>
<text x="1030" y="120" text-anchor="middle" class="lbl">CRM</text>
<text x="1030" y="138" text-anchor="middle" class="lbl-s">Write/fetch pipeline</text>
<text x="1030" y="154" text-anchor="middle" class="lbl-s">Create/update tickets</text>

<!-- edges row 1 -->
<path class="edge" d="M172 110 H330" marker-end="url(#arrow)"/>
<text x="250" y="100" text-anchor="middle" class="lbl-s">User auth, fetch chats/emails</text>

<path class="edge" d="M530 120 H650" marker-end="url(#arrow)"/>
<text x="590" y="85" text-anchor="middle" class="lbl-s">Auth</text>

<path class="edge" d="M530 145 C650 160, 800 145, 930 135" marker-end="url(#arrow)"/>
<text x="740" y="185" text-anchor="middle" class="lbl-s">Respond to the user in real time</text>

<!-- Human Approval -->
<rect x="130" y="330" width="160" height="55" rx="10" fill="var(--green)" stroke="var(--green-line)" stroke-width="1.6"/>
<text x="210" y="363" text-anchor="middle" class="lbl">Human approval</text>

<!-- Router Agent circle -->
<circle cx="440" cy="380" r="95" fill="var(--blue)" stroke="var(--blue-line)" stroke-width="1.6"/>
<text x="440" y="365" text-anchor="middle" class="lbl">Router agent</text>
<text x="440" y="385" text-anchor="middle" class="lbl-s">Understands user intent</text>
<text x="440" y="401" text-anchor="middle" class="lbl-s">Decides agent routing</text>

<!-- Q&A Agent circle -->
<circle cx="700" cy="380" r="85" fill="var(--blue)" stroke="var(--blue-line)" stroke-width="1.6"/>
<text x="700" y="368" text-anchor="middle" class="lbl">Q&amp;A agent</text>
<text x="700" y="388" text-anchor="middle" class="lbl-s">Speaks to user</text>
<text x="700" y="404" text-anchor="middle" class="lbl-s">at all times</text>

<!-- edges row 2 -->
<path class="edge" d="M430 165 C420 220, 420 260, 425 285" marker-end="url(#arrow)"/>
<text x="480" y="230" text-anchor="middle" class="lbl-s">Ask a question:</text>
<text x="480" y="246" text-anchor="middle" class="lbl-s">"I want to return product X"</text>

<path class="edge" d="M290 350 C340 340, 370 350, 355 300" marker-end="url(#arrow)"/>
<path class="edge" d="M290 365 C330 380, 350 385, 358 350" marker-end="url(#arrow)"/>

<path class="edge" d="M535 370 H615" marker-end="url(#arrow)"/>
<path class="edge" d="M615 395 H535" marker-end="url(#arrow)"/>

<!-- Vector DB -->
<g>
  <ellipse cx="130" cy="600" rx="42" ry="12" fill="var(--gray)" stroke="var(--gray-line)"/>
  <path d="M88 600 v50 a42 12 0 0 0 84 0 v-50" fill="var(--gray)" stroke="var(--gray-line)"/>
  <ellipse cx="130" cy="650" rx="42" ry="12" fill="none" stroke="var(--gray-line)"/>
  <line x1="88" y1="625" x2="172" y2="625" stroke="var(--gray-line)" stroke-width="0.7"/>
  <text x="130" y="680" text-anchor="middle" class="lbl">Vector DB</text>
  <text x="130" y="698" text-anchor="middle" class="lbl-s">FAQs, policies</text>
</g>

<!-- Return Planner Agent circle -->
<circle cx="460" cy="640" r="110" fill="var(--blue)" stroke="var(--blue-line)" stroke-width="1.6"/>
<text x="460" y="610" text-anchor="middle" class="lbl">Return planner agent</text>
<text x="460" y="630" text-anchor="middle" class="lbl-s">Decides functional calling</text>
<text x="460" y="655" text-anchor="middle" class="lbl-s">or a deterministic</text>
<text x="460" y="671" text-anchor="middle" class="lbl-s">workflow</text>

<!-- edges row 3 -->
<path class="edge" d="M440 475 C445 500, 450 520, 452 530" marker-end="url(#arrow)"/>
<text x="470" y="500" text-anchor="middle" class="lbl-s">Decide to take the</text>
<text x="470" y="516" text-anchor="middle" class="lbl-s">return route action</text>

<path class="edge" d="M540 590 C580 530, 620 460, 660 435" marker-end="url(#arrow)"/>
<text x="640" y="510" text-anchor="middle" class="lbl-s">Return latest status back</text>
<text x="640" y="526" text-anchor="middle" class="lbl-s">to Q&amp;A agent to talk to user</text>

<path class="edge" d="M172 615 C260 605, 300 610, 355 620" marker-end="url(#arrow)"/>
<text x="270" y="590" text-anchor="middle" class="lbl-s">RAG: check policy via vector DB</text>
<path class="edge" d="M172 640 C230 645, 290 650, 350 655" marker-end="url(#arrow)"/>
<text x="230" y="670" text-anchor="middle" class="lbl-s">Align with policy</text>

<!-- Policy/Guardrails diamond -->
<polygon points="430,830 560,880 430,930 300,880" fill="var(--yellow)" stroke="var(--yellow-line)" stroke-width="1.6"/>
<text x="430" y="866" text-anchor="middle" class="lbl-s">Policy / guardrails</text>
<text x="430" y="882" text-anchor="middle" class="lbl-s">Capability tokens, RBAC,</text>
<text x="430" y="896" text-anchor="middle" class="lbl-s">human approval,</text>
<text x="430" y="910" text-anchor="middle" class="lbl-s">read-back confirmation</text>

<path class="edge" d="M430 750 V830" marker-end="url(#arrow)"/>
<text x="470" y="795" text-anchor="middle" class="lbl-s">Inform the agent</text>

<!-- Shopify + Stripe -->
<rect x="260" y="1010" width="260" height="90" rx="10" fill="var(--gray)" stroke="var(--gray-line)" stroke-width="1.6"/>
<text x="390" y="1038" text-anchor="middle" class="lbl">Shopify API</text>
<text x="390" y="1056" text-anchor="middle" class="lbl-s">Track order status, RMA,</text>
<text x="390" y="1072" text-anchor="middle" class="lbl-s">exchanges</text>

<rect x="600" y="1010" width="220" height="90" rx="10" fill="var(--gray)" stroke="var(--gray-line)" stroke-width="1.6"/>
<text x="710" y="1046" text-anchor="middle" class="lbl">Stripe API</text>
<text x="710" y="1064" text-anchor="middle" class="lbl-s">Payments / refunds</text>

<path class="edge" d="M400 930 C395 960, 390 985, 388 1010" marker-end="url(#arrow)"/>
<text x="360" y="965" text-anchor="middle" class="lbl-s">If it fits the policy,</text>
<text x="360" y="981" text-anchor="middle" class="lbl-s">call Shopify API for return</text>

<path class="edge" d="M520 1055 H600" marker-end="url(#arrow)"/>

<path class="edge" d="M710 1010 C650 950, 570 780, 545 700" marker-end="url(#arrow)"/>
<text x="700" y="900" text-anchor="middle" class="lbl-s">Payment refund done</text>

</svg>
  </div>
</div>
</body>
</html>
